name: AC-4 Branch Generation

on:
  push:
    branches:
      - ac4-orchestration
  schedule:
    - cron: '0 0 * * 0' # Run weekly on Sundays
  workflow_dispatch: # Allow manual triggering

jobs:
  generate-branches:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout ac4-orchestration branch
        uses: actions/checkout@v4
        with:
          ref: ac4-orchestration
          path: orchestration

      - name: Checkout ffmpeg repository (Full)
        uses: actions/checkout@v4
        with:
          repository: FFmpeg/FFmpeg
          fetch-depth: 0
          path: ffmpeg-ac4

      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Process Tags and Inject AC-4
        id: process_tags
        run: |
          cd ffmpeg-ac4
          
          # Query upstream librempeg HEAD commit SHA
          LIBREMPEG_SHA=$(git ls-remote https://github.com/librempeg/librempeg.git HEAD | awk '{print $1}')
          LIBREMPEG_SHORT_SHA="${LIBREMPEG_SHA:0:7}"
          echo "LIBREMPEG_SHA=$LIBREMPEG_SHA" >> $GITHUB_ENV
          echo "LIBREMPEG_SHORT_SHA=$LIBREMPEG_SHORT_SHA" >> $GITHUB_ENV
          export LIBREMPEG_SHORT_SHA
          
          echo "Using upstream librempeg commit: $LIBREMPEG_SHA ($LIBREMPEG_SHORT_SHA)"

          # Add our repo as a remote to push branches to
          git remote add origin-ac4 https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
          
          # Find all tags >= n8.1.2
          tags=$(git tag --list 'n*' | grep -E '^n8\.1\.[2-9]|^n8\.[2-9]|^n9' | sort -V)
          
          mkdir -p ../patches

          for tag in $tags; do
            echo "Processing tag: $tag"
            
            # Reset to the tag
            git reset --hard
            git clean -fdx
            git checkout -B "$tag-ac4" "$tag"
            
            # Copy scripts from orchestration
            cp ../orchestration/inject-ac4.sh .
            cp ../orchestration/custom-edits.patch .
            
            # Run injection
            if ./inject-ac4.sh; then
              # Push the branch forcefully
              git push origin-ac4 "$tag-ac4" --force
              
              # Generate version-specific patch
              git diff "$tag" > "../patches/0007-ac4-${tag}.patch"
            else
              echo "Failed to inject AC-4 for tag $tag"
              exit 1
            fi
          done

      - name: Checkout swmarks/CoreELEC
        uses: actions/checkout@v4
        with:
          repository: swmarks/CoreELEC
          token: ${{ secrets.COREELEC_PAT }}
          fetch-depth: 0
          path: coreelec-repo

      - name: Synchronize CoreELEC Version Branches and PR
        run: |
          cd coreelec-repo
          
          # Add upstream pannal remote and fetch coreelec-21_local
          git remote add panni https://github.com/pannal/CoreELEC.git || git remote set-url panni https://github.com/pannal/CoreELEC.git
          git fetch panni coreelec-21_local
          
          # 1. Process and generate versioned branches based on panni/coreelec-21_local
          for patch_file in ../patches/0007-ac4-n*.patch; do
            [ -f "$patch_file" ] || continue
            filename=$(basename "$patch_file")
            tag="${filename#0007-ac4-}"
            tag="${tag%.patch}"
            version="${tag#n}"
            
            tarball_url="https://ffmpeg.org/releases/ffmpeg-${version}.tar.xz"
            
            # Check if official release tarball exists
            if curl --output /dev/null --silent --head --fail "$tarball_url"; then
              echo "=========================================="
              echo "Processing CoreELEC branch for FFmpeg ${version} (${tag})"
              echo "=========================================="
              
              pkg_sha256=$(curl -sL "$tarball_url" | sha256sum | awk '{print $1}')
              branch_name="ffmpeg-${version}-ac4"
              
              git checkout -B "$branch_name" panni/coreelec-21_local
              
              cp "$patch_file" packages/multimedia/ffmpeg/patches/0007-add-ac4-decoder-parser-from-librempeg.patch
              
              sed -i "s/^PKG_VERSION=\".*\"/PKG_VERSION=\"${version}\"/" packages/multimedia/ffmpeg/package.mk
              sed -i "s/^PKG_SHA256=\".*\"/PKG_SHA256=\"${pkg_sha256}\"/" packages/multimedia/ffmpeg/package.mk
              
              git add packages/multimedia/ffmpeg/package.mk packages/multimedia/ffmpeg/patches/0007-add-ac4-decoder-parser-from-librempeg.patch
              
              if ! git diff --cached --quiet; then
                git commit -m "ffmpeg: Update to ${version} with AC-4 patch from librempeg (${LIBREMPEG_SHORT_SHA})"
                git push origin "$branch_name" --force
                echo "Pushed updated branch $branch_name"
              else
                echo "No changes for branch $branch_name"
              fi
            else
              echo "Skipping non-tarball/dev tag $tag for standalone CoreELEC package branch"
            fi
          done
          
          # 2. Update ffmpeg-ac4-codec branch and open/update PR
          echo "=========================================="
          echo "Checking ffmpeg-ac4-codec branch for PR update"
          echo "=========================================="
          
          git fetch origin ffmpeg-ac4-codec
          git checkout -B bot/update-ac4 origin/ffmpeg-ac4-codec
          
          target_version=$(grep '^PKG_VERSION=' packages/multimedia/ffmpeg/package.mk | head -n1 | cut -d'"' -f2)
          target_patch="../patches/0007-ac4-n${target_version}.patch"
          
          if [ -f "$target_patch" ]; then
            cp "$target_patch" packages/multimedia/ffmpeg/patches/0007-add-ac4-decoder-parser-from-librempeg.patch
            git add packages/multimedia/ffmpeg/patches/0007-add-ac4-decoder-parser-from-librempeg.patch
            
            if ! git diff --cached --quiet; then
              git commit -m "ffmpeg: Update AC-4 decoder patch from librempeg (${LIBREMPEG_SHORT_SHA})"
              git push origin bot/update-ac4 --force
              
              gh pr create \
                --title "Update AC-4 FFmpeg Patch from librempeg (${LIBREMPEG_SHORT_SHA})" \
                --body "Automated PR from ffmpeg-ac4 sync action. Upstream librempeg commit: https://github.com/librempeg/librempeg/commit/${LIBREMPEG_SHA}. Custom ARM DSP edits applied." \
                --base ffmpeg-ac4-codec \
                --head bot/update-ac4 || echo "PR already exists"
            else
              echo "Patch in ffmpeg-ac4-codec is already up to date with librempeg (${LIBREMPEG_SHORT_SHA})"
            fi
          else
            echo "Warning: No matching patch found for target version n${target_version}"
          fi
        env:
          GH_TOKEN: ${{ secrets.COREELEC_PAT }}
          LIBREMPEG_SHA: ${{ env.LIBREMPEG_SHA }}
          LIBREMPEG_SHORT_SHA: ${{ env.LIBREMPEG_SHORT_SHA }}
